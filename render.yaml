services:
  - type: web
    name: personalized-food-recommendation-frontend
    runtime: static
    repo: https://github.com/LitchiCat1/Personalized-Food-Recommendation-System
    rootDir: frontend
    branch: v0.0.7e
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: personalized-food-recommendation-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: EXPO_PUBLIC_SUPABASE_URL
        fromService:
          type: web
          name: personalized-food-recommendation-backend
          envVarKey: SUPABASE_URL
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        fromService:
          type: web
          name: personalized-food-recommendation-backend
          envVarKey: SUPABASE_PUBLISHABLE_KEY
      - key: EXPO_PUBLIC_SUPABASE_AUTH_REQUIRED
        value: "true"
      - key: GOOGLE_PLACES_API_KEY
        fromService:
          type: web
          name: personalized-food-recommendation-backend
          envVarKey: GOOGLE_PLACES_API_KEY

  - type: web
    name: personalized-food-recommendation-backend
    runtime: python
    repo: https://github.com/LitchiCat1/Personalized-Food-Recommendation-System
    plan: free
    rootDir: backend
    branch: v0.0.7e
    buildCommand: pip install -r requirements.txt
    startCommand: python -u app.py
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      - key: SUPABASE_AUTH_REQUIRED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
