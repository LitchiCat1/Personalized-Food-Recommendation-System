services:
  - type: web
    name: personalized-food-recommendation-frontend
    runtime: static
    repo: https://github.com/LitchiCat1/Personalized-Food-Recommendation-System
    rootDir: frontend
    branch: v0.0.5
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://personalized-food-recommendation-system-nq8t.onrender.com
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false

  - type: web
    name: personalized-food-recommendation-backend
    runtime: python
    repo: https://github.com/LitchiCat1/Personalized-Food-Recommendation-System
    plan: free
    rootDir: backend
    branch: v0.0.5
    buildCommand: pip install -r requirements.txt
    startCommand: python -u app.py
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      - key: SUPABASE_AUTH_REQUIRED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
