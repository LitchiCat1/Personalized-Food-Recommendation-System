name: CI

on:
  push:
    branches:
      - main
      - v0.0.3
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile \
            backend/app.py \
            backend/repositories/storage.py \
            backend/services/disease_rule_service.py \
            backend/services/env_service.py \
            backend/services/food_service.py \
            backend/services/history_service.py \
            backend/services/nutrition_label_service.py \
            backend/services/predict_service.py \
            backend/services/profile_service.py \
            backend/services/recommend_service.py \
            backend/services/healthy_food_service.py

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
