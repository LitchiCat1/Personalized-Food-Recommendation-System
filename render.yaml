services:
  - type: web
    name: nutrilens-frontend
    runtime: static
    repo: https://github.com/LitchiCat1/Personalized-Food-Recommendation-System
    rootDir: frontend
    branch: v0.0.9
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    # 打包出來的檔名帶 content hash（entry-<hash>.js），內容變了檔名就會變，
    # 所以可以放心讓瀏覽器長期快取。先前用的是預設的 max-age=0：
    # 每次造訪都要重新驗證並下載那顆 760 KB（brotli 後）的 bundle，
    # 免費方案的頻寬就是這樣被吃光的。
    headers:
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html 不能長期快取，否則使用者會一直停在舊版本
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: nutrilens-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: EXPO_PUBLIC_SUPABASE_URL
        fromService:
          type: web
          name: nutrilens-backend
          envVarKey: SUPABASE_URL
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        fromService:
          type: web
          name: nutrilens-backend
          envVarKey: SUPABASE_PUBLISHABLE_KEY
      - key: EXPO_PUBLIC_SUPABASE_AUTH_REQUIRED
        value: "true"
      - key: GOOGLE_PLACES_API_KEY
        fromService:
          type: web
          name: nutrilens-backend
          envVarKey: GOOGLE_PLACES_API_KEY

  - type: web
    name: nutrilens-backend
    runtime: python
    repo: https://github.com/LitchiCat1/Personalized-Food-Recommendation-System
    plan: free
    rootDir: backend
    branch: v0.0.9
    buildCommand: pip install -r requirements.txt
    startCommand: python -u app.py
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false
      # 店家菜單快取要放另一個 Supabase 時才填；留空就跟 DATABASE_URL 同一個
      - key: MENU_DATABASE_URL
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      # 只放行自己的前端。沒設定的話後端只接受 localhost。
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_AUTH_REQUIRED
        value: "true"
      - key: APP_UTC_OFFSET_HOURS
        value: "8"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
