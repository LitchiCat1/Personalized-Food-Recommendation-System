services:
  - type: web
    name: nutrilens-frontend
    runtime: static
    repo: https://github.com/LitchiCat1/Personalized-Food-Recommendation-System
    rootDir: frontend
    branch: v0.0.9
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    # 打包出來的檔名帶 content hash（entry-<hash>.js），內容變了檔名就會變，
    # 所以可以放心讓瀏覽器長期快取。先前用的是預設的 max-age=0：
    # 每次造訪都要重新驗證並下載那顆 760 KB（brotli 後）的 bundle，
    # 免費方案的頻寬就是這樣被吃光的。
    headers:
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html 不能長期快取，否則使用者會一直停在舊版本
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: nutrilens-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: EXPO_PUBLIC_AUTH_REQUIRED
        value: "true"
      - key: GOOGLE_PLACES_API_KEY
        fromService:
          type: web
          name: nutrilens-backend
          envVarKey: GOOGLE_PLACES_API_KEY

  - type: web
    name: nutrilens-backend
    runtime: python
    repo: https://github.com/LitchiCat1/Personalized-Food-Recommendation-System
    plan: free
    rootDir: backend
    branch: v0.0.9
    buildCommand: pip install -r requirements.txt
    startCommand: python -u app.py
    # 資料存在 Supabase 的 Postgres：DATABASE_URL 填 Supabase → Connect → Session pooler
    # 的連線字串（Render 只走 IPv4，db.<ref>.supabase.co 那個直連網址連不上）。
    # 沒設的話會用 Render 磁碟上的 SQLite，每次部署都會清空。
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      # 只放行自己的前端。沒設定的話後端只接受 localhost。
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      # Render 上每個連線都算其他裝置；不開放的話沒有人能註冊。
      # 後端在 Render 上沒設這個也會當作開放，要關掉就設 "false"。
      - key: OPEN_SIGNUP
        value: "true"
      - key: APP_UTC_OFFSET_HOURS
        value: "8"
      - key: GOOGLE_PLACES_API_KEY
        sync: false
