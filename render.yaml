services:
  - type: web
    name: personalized-food-recommendation-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -u app.py
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_DEBUG
        value: "false"
